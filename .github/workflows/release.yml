name: Release

# A version tag (v0.3.0) builds the installers — .deb and .rpm, a universal
# .dmg, a Windows .exe — and puts them in a draft release, which nobody sees
# until it is published by hand. Run by hand, it builds the same installers
# as workflow artifacts and releases nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job asks for more: a build step or a third-party action
# never holds a token that can push or publish.
permissions:
  contents: read

jobs:
  linux:
    name: Linux — .deb and .rpm
    # A binary runs on a newer glibc, never an older one, so it is built on
    # the oldest system it supports (docs/distributions.md).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm --prefix core ci
      # beforeBuildCommand syncs the release sidecars itself.
      - run: npm --prefix core run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: posma-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  macos:
    name: macOS — universal .dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm --prefix core ci
      - run: node scripts/sync-sidecars.mjs release --universal
      - run: npm --prefix core run tauri build -- --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: posma-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows — .exe installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm --prefix core ci
      - run: npm --prefix core run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: posma-windows
          path: target/release/bundle/nsis/*.exe

  # One job creates the release: parallel jobs each looking for a draft by
  # its tag would not find the other's, and make two.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # Re-running the workflow for the same tag replaces the files in the
      # draft it made the first time.
      - name: Create the draft and attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "POSMA $GITHUB_REF_NAME" --generate-notes
          find installers -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
