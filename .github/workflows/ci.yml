name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Dependency advisories appear after code stops changing, so audit runs on
  # a schedule too rather than only when something is pushed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The app bundles compiled module binaries, so `core` cannot build
      # until they exist. This is the same first-build ordering documented
      # in docs/building.md.
      - name: Build modules and sync sidecars
        run: node scripts/sync-sidecars.mjs

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Nobody here owns a Mac or a Windows machine to test on, so these are the
  # first place the code runs on either. Each builds that system's modules
  # the way a release does and runs every test the workspace has.
  macos:
    name: macOS ${{ matrix.arch }} — build, test, clippy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: Apple silicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build modules and sync sidecars
        run: node scripts/sync-sidecars.mjs
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows:
    name: Windows — build, test, clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build modules and sync sidecars
        run: node scripts/sync-sidecars.mjs
      # The Linux and macOS brokers are a Unix-socket daemon at heart and are
      # never built for Windows.
      # Without the test features too: a test macro outside #[cfg(test)]
      # once broke only this build, the one an installer makes.
      - name: Build workspace
        run: cargo build --workspace --locked --exclude linux-broker --exclude macos-broker
      - name: Test workspace
        run: cargo test --workspace --locked --exclude linux-broker --exclude macos-broker
      # The UAC path end to end against the broker the sync just built: the
      # elevated start, the pipe, the check on who connected, and a second
      # answer from the same session. A runner's account starts it without
      # a prompt; should one ever appear, the timeout ends the wait.
      - name: Elevated broker session
        timeout-minutes: 5
        run: cargo test -p core --locked -- --ignored one_elevated_session_answers_every_call
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --exclude linux-broker --exclude macos-broker -- -D warnings

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: core/package-lock.json

      - run: npm --prefix core ci
      - run: npx --prefix core tsc --noEmit --project core
      - run: npm --prefix core run build

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on actual advisories. Deliberately not `--deny warnings`:
      # an upstream crate becoming unmaintained is worth seeing, but it is
      # not a reason to block a build on work that isn't ours.
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Audit npm dependencies
        run: npm --prefix core audit --audit-level=high

  # Half the supported distributions are rolling releases: a package
  # manager can change what it prints without a line of ours changing. So
  # this runs on the schedule and on request, not on every push — it pulls
  # some twenty images.
  distributions:
    name: Linux distributions — modules against each package manager
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Run every module in a container of each distribution
        run: bash scripts/distro-check.sh --kernels --grub
