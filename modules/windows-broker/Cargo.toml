[package]
name = "windows-broker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "windows-broker"
path = "src/main.rs"

[dependencies]
broker-common = { path = "../../crates/broker-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# The OEM code page console tools write, and where Program Files is.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_UI_Shell"] }
