[package]
name = "windows-broker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "windows-broker"
path = "src/main.rs"

[dependencies]
broker-common = { path = "../../crates/broker-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Reading the OEM code page console tools write.
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
