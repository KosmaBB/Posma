[package]
name = "core"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2"
distro = { path = "../../crates/distro" }
tokio = { version = "1", features = ["sync", "process", "io-util", "net", "time"] }

[target.'cfg(windows)'.dependencies]
# The UAC prompt (ShellExecuteExW "runas") and the check on who connected to
# the broker's pipe. Already in the tree through Tauri.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# "rt" i "macros" tylko do testów — rejestr jest asynchroniczny.
tokio = { version = "1", features = ["rt", "macros"] }
